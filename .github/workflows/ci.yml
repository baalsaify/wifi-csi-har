name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  docker:
    name: Build image and smoke-test the API
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t wifi-csi-har:ci .
      - name: Run container
        run: docker run -d --name har -p 8000:8000 wifi-csi-har:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"model_loaded":true'
      - name: Call /model-info and /predict
        run: |
          curl -fsS http://127.0.0.1:8000/model-info
          python3 -c "import json,random; random.seed(0); print(json.dumps({'csi_amplitude': [[random.uniform(5,20) for _ in range(90)] for _ in range(200)]}))" > req.json
          curl -fsS -X POST http://127.0.0.1:8000/predict -H 'Content-Type: application/json' -d @req.json
      - name: Container logs
        if: always()
        run: docker logs har
