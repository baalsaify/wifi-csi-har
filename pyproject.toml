[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-har"
version = "0.1.0"
description = "Wi-Fi CSI human activity recognition: preprocessing, a 1D-CNN, cross-subject evaluation, and a FastAPI inference service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baha A. Alsaify" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.3", "matplotlib>=3.7", "httpx>=0.25"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "pydantic>=2.5"]
dev = ["csi-har[train,api]", "pytest>=8", "ruff>=0.5", "httpx>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom: `file: UploadFile = File(...)`
"src/csi_har/api/main.py" = ["B008"]
